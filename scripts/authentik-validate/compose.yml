# Throwaway Authentik for validating authentik/authentik-config.yaml; see
# scripts/validate_authentik_config.py. Nothing here is persisted or published.
services:
  postgresql:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: validation-only
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 2s
      retries: 30
  authentik:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION}
    entrypoint: ["sleep", "infinity"]
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: validation-only
      AUTHENTIK_SECRET_KEY: validation-only-validation-only-validation-only
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      BLUEPRINT_LOGS_CLIENT_SECRET: validation-only
      BLUEPRINT_METRICS_CLIENT_SECRET: validation-only
      BLUEPRINT_GOOGLE_CLIENT_ID: validation-only
      BLUEPRINT_GOOGLE_CLIENT_SECRET: validation-only
    volumes:
      - ../../authentik:/blueprints/custom:ro
