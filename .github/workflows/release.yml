name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CADDY_IMAGE_NAME: ghcr.io/${{ github.repository }}-caddy
  FLUENT_BIT_IMAGE_NAME: ghcr.io/${{ github.repository }}-fluent-bit

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # The tag is passed to a shell on the deploy host, so keep it to safe characters.
          [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "Unsupported tag: $tag" >&2; exit 1; }
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push broker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Build and push Caddy image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: caddy
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.CADDY_IMAGE_NAME }}:${{ steps.tag.outputs.value }}
            ${{ env.CADDY_IMAGE_NAME }}:latest

      - name: Build and push Fluent Bit image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: fluent-bit
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.FLUENT_BIT_IMAGE_NAME }}:${{ steps.tag.outputs.value }}
            ${{ env.FLUENT_BIT_IMAGE_NAME }}:latest

  # The deploy bundle is what the host deploys from: this release's
  # docker-compose.yml and deploy.sh, attached to the GitHub Release.
  package:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.bundle.outputs.sha256 }}
    env:
      TAG: ${{ needs.build-and-push.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Build deploy bundle
        id: bundle
        run: |
          mkdir "deploy-$TAG"
          cp docker-compose.yml scripts/deploy.sh "deploy-$TAG/"
          # Fixed order, times and owners, so a re-run builds the same bytes.
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - "deploy-$TAG" \
            | gzip -n > "deploy-$TAG.tar.gz"
          echo "sha256=$(sha256sum "deploy-$TAG.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Attach bundle to the release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG"
          gh release upload "$TAG" "deploy-$TAG.tar.gz" --clobber

  # Each deploy job waits for manual approval through its environment's
  # protection rule (Settings > Environments), then has the host fetch this
  # release's deploy bundle and run its deploy.sh, which pins the container to
  # this release's tag and restarts it. See "Deploying" in the README.
  deploy-caddy:
    needs: [build-and-push, package]
    runs-on: ubuntu-latest
    environment: deploy-caddy
    concurrency:
      group: deploy-caddy
      cancel-in-progress: false
    env:
      TAG: ${{ needs.build-and-push.outputs.tag }}
      DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      BUNDLE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.build-and-push.outputs.tag }}/deploy-${{ needs.build-and-push.outputs.tag }}.tar.gz
      BUNDLE_SHA256: ${{ needs.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          ORACLE_SSH_TOKEN: ${{ secrets.ORACLE_SSH_TOKEN }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_TOKEN" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy Caddy
        run: ssh -i ~/.ssh/id_deploy "$DEPLOY_TARGET" bash -s -- caddy "$TAG" "$BUNDLE_URL" "$BUNDLE_SHA256" < scripts/fetch-release.sh

  deploy-config:
    needs: [build-and-push, package]
    runs-on: ubuntu-latest
    environment: deploy-config
    concurrency:
      group: deploy-config
      cancel-in-progress: false
    env:
      TAG: ${{ needs.build-and-push.outputs.tag }}
      DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      BUNDLE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.build-and-push.outputs.tag }}/deploy-${{ needs.build-and-push.outputs.tag }}.tar.gz
      BUNDLE_SHA256: ${{ needs.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          ORACLE_SSH_TOKEN: ${{ secrets.ORACLE_SSH_TOKEN }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_TOKEN" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy config server
        run: ssh -i ~/.ssh/id_deploy "$DEPLOY_TARGET" bash -s -- auth-broker "$TAG" "$BUNDLE_URL" "$BUNDLE_SHA256" < scripts/fetch-release.sh

      - name: Check every device is still there
        run: ssh -i ~/.ssh/id_deploy "$DEPLOY_TARGET" docker exec auth-broker flask --app wsgi devices list

      # Fluent Bit only ships logs, so it rides along with the config server
      # deploy rather than needing an approval of its own.
      - name: Deploy Fluent Bit
        run: ssh -i ~/.ssh/id_deploy "$DEPLOY_TARGET" bash -s -- fluent-bit "$TAG" "$BUNDLE_URL" "$BUNDLE_SHA256" < scripts/fetch-release.sh
