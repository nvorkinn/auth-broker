name: Release

on:
  push:
    tags: ["v*"]
  # The "Run workflow" button (Actions > Release): tags the head of main with the next version after the
  # latest v* tag, then releases it in this same run. A tag pushed with the workflow's own token starts no
  # second run.
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      # To create the tag on a button release.
      contents: write
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - name: Work out and create the next tag
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Release from main, not $GITHUB_REF" >&2; exit 1; }
          latest="$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'v*' \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major="${major#v}"
          case "$BUMP" in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v$major.$((minor + 1)).0" ;;
            *) next="v$major.$minor.$((patch + 1))" ;;
          esac
          # Fails if the tag already exists, e.g. two releases started at once.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$next" -f sha="$GITHUB_SHA" > /dev/null
          echo "Tagged $GITHUB_SHA as $next (after ${latest:-no tag})"
          echo "NEXT_TAG=$next" >> "$GITHUB_ENV"

      - name: Extract tag
        id: tag
        run: |
          # The tag just made by the button, else the pushed tag.
          tag="${NEXT_TAG:-${GITHUB_REF#refs/tags/}}"
          # The tag is passed to a shell on the deploy host, so keep it to safe characters.
          [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "Unsupported tag: $tag" >&2; exit 1; }
          echo "value=$tag" >> "$GITHUB_OUTPUT"

  # One build per image, side by side. Each is tagged with the release tag and
  # latest, for amd64 and arm64 (the host is ARM).
  images:
    name: image ${{ matrix.image }}
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: auth-broker
            context: .
          - image: auth-broker-caddy
            context: caddy
          - image: auth-broker-fluent-bit
            context: fluent-bit
          - image: auth-broker-victoria-logs
            context: victoria-logs
          - image: auth-broker-victoria-metrics
            context: victoria-metrics
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The broker image bakes in vendor/countdown-api; the infra images don't use it.
          submodules: ${{ matrix.context == '.' }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ needs.tag.outputs.value }}
            ${{ env.IMAGE }}:latest

  # The deploy bundles are what the hosts deploy from: this release's
  # docker-compose.yml, deploy.sh, Authentik's brand assets and SOPS-encrypted
  # secrets, attached to the GitHub Release. There is one per target, holding
  # only that target's secrets/<target>/, so a host never gets (or could decrypt)
  # another environment's. They don't need the images, so they build alongside them.
  package:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # {"<target>": "<the bundle's SHA-256>", ...}
      sha256: ${{ steps.bundle.outputs.sha256 }}
    env:
      TAG: ${{ needs.tag.outputs.value }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Build deploy bundles
        id: bundle
        run: |
          shas='{}'
          for target in dev; do
            rm -rf "deploy-$TAG"
            mkdir -p "deploy-$TAG/secrets" "deploy-$TAG/authentik"
            cp docker-compose.yml scripts/deploy.sh "deploy-$TAG/"
            cp "secrets/$target"/*.env "deploy-$TAG/secrets/"
            mkdir -p "deploy-$TAG/authentik-assets"
            cp authentik-assets/countdown-pill.svg "deploy-$TAG/authentik-assets/"
            # Fixed order, times and owners, so a re-run builds the same bytes.
            tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - "deploy-$TAG" \
              | gzip -n > "deploy-$TAG-$target.tar.gz"
            sha="$(sha256sum "deploy-$TAG-$target.tar.gz" | cut -d' ' -f1)"
            shas="$(jq -c --arg target "$target" --arg sha "$sha" '. + {($target): $sha}' <<< "$shas")"
          done
          echo "sha256=$shas" >> "$GITHUB_OUTPUT"

      - name: Attach bundles to the release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG"
          gh release upload "$TAG" "deploy-$TAG"-*.tar.gz --clobber

  # Each target deploys this repo's services and authentik, each after its own
  # approval (deploy-services.yml, deploy-authentik.yml). The services wait for
  # the images; authentik runs upstream's image, so it only needs the bundle and
  # can be approved while the images are still building. A target's environment
  # holds its host's secrets (DEPLOY_HOST and the rest); the approval is a
  # separate environment's, so the services' jobs ask once between them.
  deploy-services-dev:
    name: services (dev-qa)
    needs: [tag, images, package]
    uses: ./.github/workflows/deploy-services.yml
    with:
      environment: dev-qa
      approval: deploy-infra
      target: dev
      tag: ${{ needs.tag.outputs.value }}
      bundle_sha256: ${{ fromJSON(needs.package.outputs.sha256).dev }}
    secrets: inherit

  deploy-authentik-dev:
    name: authentik (dev-qa)
    needs: [tag, package]
    # The terraform job it calls comments on pull requests, so its token asks for this even here.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/deploy-authentik.yml
    with:
      environment: dev-qa
      approval: deploy-authentik
      target: dev
      tag: ${{ needs.tag.outputs.value }}
      bundle_sha256: ${{ fromJSON(needs.package.outputs.sha256).dev }}
    secrets: inherit
