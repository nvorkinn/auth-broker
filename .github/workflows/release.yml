name: Release

on:
  push:
    tags: ["v*"]
  # The "Run workflow" button (Actions > Release): tags the head of main with the next version after the
  # latest v* tag, then releases it in this same run. A tag pushed with the workflow's own token starts no
  # second run.
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      # To create the tag on a button release.
      contents: write
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - name: Work out and create the next tag
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Release from main, not $GITHUB_REF" >&2; exit 1; }
          latest="$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'v*' \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major="${major#v}"
          case "$BUMP" in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v$major.$((minor + 1)).0" ;;
            *) next="v$major.$minor.$((patch + 1))" ;;
          esac
          # Fails if the tag already exists, e.g. two releases started at once.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$next" -f sha="$GITHUB_SHA" > /dev/null
          echo "Tagged $GITHUB_SHA as $next (after ${latest:-no tag})"
          echo "NEXT_TAG=$next" >> "$GITHUB_ENV"

      - name: Extract tag
        id: tag
        run: |
          # The tag just made by the button, else the pushed tag.
          tag="${NEXT_TAG:-${GITHUB_REF#refs/tags/}}"
          # The tag is passed to a shell on the deploy host, so keep it to safe characters.
          [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "Unsupported tag: $tag" >&2; exit 1; }
          echo "value=$tag" >> "$GITHUB_OUTPUT"

  # One build per image, side by side. Each is tagged with the release tag and
  # latest, for amd64 and arm64 (the host is ARM).
  images:
    name: image ${{ matrix.image }}
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: auth-broker
            context: .
          - image: auth-broker-caddy
            context: caddy
          - image: auth-broker-fluent-bit
            context: fluent-bit
          - image: auth-broker-victoria-logs
            context: victoria-logs
          - image: auth-broker-victoria-metrics
            context: victoria-metrics
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The broker image bakes in vendor/countdown-api; the infra images don't use it.
          submodules: ${{ matrix.context == '.' }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ needs.tag.outputs.value }}
            ${{ env.IMAGE }}:latest

  # The deploy bundle is what the host deploys from: this release's
  # docker-compose.yml, deploy.sh, Authentik blueprint and SOPS-encrypted
  # secrets, attached to the GitHub Release. It doesn't need the images, so it
  # builds alongside them.
  package:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.bundle.outputs.sha256 }}
    env:
      TAG: ${{ needs.tag.outputs.value }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Build deploy bundle
        id: bundle
        run: |
          mkdir -p "deploy-$TAG/secrets" "deploy-$TAG/authentik"
          cp docker-compose.yml scripts/deploy.sh "deploy-$TAG/"
          cp secrets/*.env "deploy-$TAG/secrets/"
          cp authentik/authentik-config.yaml "deploy-$TAG/authentik/"
          mkdir -p "deploy-$TAG/authentik-assets"
          cp authentik-assets/countdown-pill.svg "deploy-$TAG/authentik-assets/"
          # Fixed order, times and owners, so a re-run builds the same bytes.
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - "deploy-$TAG" \
            | gzip -n > "deploy-$TAG.tar.gz"
          echo "sha256=$(sha256sum "deploy-$TAG.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Attach bundle to the release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG"
          gh release upload "$TAG" "deploy-$TAG.tar.gz" --clobber

  # Each deploy waits for manual approval through its environment's protection
  # rule (Settings > Environments), then has the host fetch this release's
  # deploy bundle and run its deploy.sh once per service. See "Deploying" in
  # the README. These deploy this repo's images, so they wait for them; each
  # pins its container to this release's tag and restarts it.
  deploy:
    name: ${{ matrix.environment }}
    needs: [tag, images, package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: deploy-caddy
            services: caddy
          # Fluent Bit, VictoriaLogs and VictoriaMetrics only collect logs and
          # metrics, so they ride along with the config server rather than needing an
          # approval of their own. So does Redis, last for now: nothing reads it
          # yet, so a problem with it can't hold up a broker deploy. Move it
          # before auth-broker once the broker uses it.
          - environment: deploy-config
            services: auth-broker fluent-bit victoria-logs victoria-metrics redis
    environment: ${{ matrix.environment }}
    concurrency:
      group: ${{ matrix.environment }}-${{ needs.tag.outputs.value }}
      cancel-in-progress: false
    env: &deploy-env
      TAG: ${{ needs.tag.outputs.value }}
      SERVICES: ${{ matrix.services }}
      DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      BUNDLE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.tag.outputs.value }}/deploy-${{ needs.tag.outputs.value }}.tar.gz
      BUNDLE_SHA256: ${{ needs.package.outputs.sha256 }}
    steps: &deploy-steps
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          ORACLE_SSH_TOKEN: ${{ secrets.ORACLE_SSH_TOKEN }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_TOKEN" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # In order, stopping at the first failure. Deploying the config server
      # also lists the devices, as a check that the database came through.
      - name: Deploy ${{ matrix.services }}
        run: |
          for service in $SERVICES; do
            echo "::group::Deploy $service"
            ssh -i ~/.ssh/id_deploy "$DEPLOY_TARGET" bash -s -- "$service" "$TAG" "$BUNDLE_URL" "$BUNDLE_SHA256" < scripts/fetch-release.sh
            echo "::endgroup::"
          done

  # Authentik runs upstream's image, so these only need the bundle and can be
  # approved while the images are still building. Same steps as deploy.
  deploy-authentik:
    name: ${{ matrix.environment }}
    needs: [tag, package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Installs this release's compose file, then brings up the three
          # Authentik services on the AUTHENTIK_VERSION pinned in the host's .env.
          - environment: deploy-authentik
            services: authentik
          # The same, then installs authentik/authentik-config.yaml and applies
          # it to the running Authentik with `ak apply_blueprint`.
          - environment: deploy-authentik-config
            services: authentik-config
    environment: ${{ matrix.environment }}
    concurrency:
      group: ${{ matrix.environment }}-${{ needs.tag.outputs.value }}
      cancel-in-progress: false
    env: *deploy-env
    steps: *deploy-steps
