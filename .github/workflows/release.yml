name: Release

on:
  push:
    tags: ["v*"]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CADDY_IMAGE_NAME: ghcr.io/${{ github.repository }}-caddy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: tag
        run: echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build and push broker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Build and push Caddy image
        uses: docker/build-push-action@v7
        with:
          context: caddy
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.CADDY_IMAGE_NAME }}:${{ steps.tag.outputs.value }}
            ${{ env.CADDY_IMAGE_NAME }}:latest
