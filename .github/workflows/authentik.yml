name: Authentik config

# Applies the blueprint to a throwaway Authentik, so it only runs when something that feeds it changes.
# all-checks treats a workflow that never started as fine.
on:
  push:
    branches: [main]
    paths: &paths
      - authentik/**
      - scripts/validate_authentik_config.py
      - scripts/authentik-validate/**
      - docker-compose.yml
      - tests/test_authentik_validation.py
      - .github/workflows/authentik.yml
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentik:
    name: validate Authentik config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Applies the blueprint to a throwaway Authentik and Postgres: no secrets, so fork PRs run it too.
      - name: Apply to a throwaway Authentik
        run: python scripts/validate_authentik_config.py
