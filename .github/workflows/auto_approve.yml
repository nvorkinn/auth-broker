name: Auto Approve PR

on:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - .github/workflows/terraform.yml
  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    uses: ./.github/workflows/terraform.yml
    secrets: inherit
  tests:
    uses: ./.github/workflows/tests.yml
  auto-approve:
    needs: [terraform, tests]
    uses: nvorkinn/.github/.github/workflows/auto-approve.yml@main
    # Inherit secrets if you decide to use a custom PAT later,
    # though GITHUB_TOKEN permissions from the template work perfectly here.
