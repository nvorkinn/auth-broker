name: All checks

# The one check branch protection requires is "Global PR Status", opened by Create Global PR Status and completed by
# this once every other workflow and check on the commit has passed. The logic is shared: see
# nvorkinn/.github/.github/workflows/all-checks.yml. Each workflow listed here ends by running this once; add a workflow
# that runs on pull requests to the list (a test fails until you do), except Auto-approve PRs, which waits for the
# status check.
on:
  workflow_run:
    workflows: [ Create Global PR Status, Tests, Terraform, CodeQL ]
    types: [ completed ]

permissions:
  actions: read
  checks: write

jobs:
  all-checks:
    uses: nvorkinn/.github/.github/workflows/all-checks.yml@3d6b3965576e0a41776d8d9129da734ba6a1fc60 # main
    with:
      create-workflow-file: create_global_pr_status.yml
