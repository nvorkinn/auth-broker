name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # vendor/countdown-api is a submodule: the API contract and the code generated from it.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # uv rather than pip: about 10s quicker, most of the job before the tests.
      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test dashboard browser logic
        run: node --test tests/browser/*.test.cjs

      - name: Run tests
        # One worker per CPU; pytest-cov combines their coverage.
        run: python -m pytest -n auto -v --cov=broker --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true

  # Everything in secrets/ is committed, so make sure no value in it is plaintext.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets are encrypted
        run: |
          status=0
          for f in secrets/*.env; do
            # SOPS's dotenv format: every value is ENC[...], plus its own sops_* metadata.
            if ! grep -q '^sops_mac=' "$f" || grep -vE '^(#|$|sops_)' "$f" | grep -qv '=ENC\['; then
              echo "::error file=$f::not fully SOPS-encrypted; encrypt it with sops before committing"
              status=1
            fi
          done
          exit $status

  # Builds each container image and checks the config baked into it. Every
  # image has its program as the entrypoint, so `check` is just its args.
  image:
    name: test image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: caddy
            check: validate --config /etc/caddy/Caddyfile --adapter caddyfile
          - image: fluent-bit
            check: --dry-run --config /fluent-bit/etc/fluent-bit.yaml
          # The broker itself: its CMD is overridden, and importing the submodule's code checks it was copied in and installed.
          - image: broker
            context: .
            check: python -c "import countdown_api.blueprints"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build image
        run: docker build -t auth-broker-${{ matrix.image }} ${{ matrix.context || matrix.image }}

      - name: Check config
        run: docker run --rm auth-broker-${{ matrix.image }} ${{ matrix.check }}
