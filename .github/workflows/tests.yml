name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tests in 3 shards side by side (pytest-shard, split by test ID), and Codecov merges their coverage reports
  # (codecov.yml waits for all of them). Keep the shard list 0 to N-1 for --num-shards below.
  test:
    name: test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # One shard's failure shouldn't hide the others'.
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      # vendor/countdown-api, the store contract, is a submodule.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # uv installs the Python .python-version names itself. setup-uv caches uv's downloads, keyed on (among others)
      # uv.lock.
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Install redis-server
        # For the render queue's script's tests against a real Redis (tests/services/test_render_jobs.py starts its
        # own; they skip without it).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server

      # Exactly what uv.lock pins, dev group included, into .venv.
      - name: Install dependencies
        run: uv sync --locked

      # The browser tests don't depend on the shard, so only the first runs them.
      - name: Test dashboard browser logic
        if: matrix.shard == 0
        run: node --test tests/browser/*.test.cjs

      - name: Run tests
        # This shard's tests, one worker per CPU; pytest-cov combines their coverage. No terminal coverage report: a
        # shard's alone would list as missing every line only the other shards' tests reach.
        run: >-
          uv run --no-sync python -m pytest -n auto -v --num-shards 3 --shard-id ${{ matrix.shard }}
          --cov=broker --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true

  # Lint and formatting, with the Ruff uv.lock pins.
  ruff:
    runs-on: ubuntu-latest
    steps:
      # uv checks uv.lock against every project in it, vendor/countdown-api included.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Restore only: this job installs just the dev group, so a cache it saved under the test jobs' key would be
      # missing most of what they need.
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          save-cache: false

      - name: Lint
        run: uv run --locked --only-dev ruff check .

      - name: Check formatting
        run: uv run --locked --only-dev ruff format --check .

  # Type checking, with the ty uv.lock pins. ty resolves imports from the installed dependencies, so this installs
  # what the test jobs do (and shares their cache).
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Type check
        run: uv run --locked ty check

  # Everything in secrets/ is committed, so make sure no value in it is plaintext.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets are encrypted
        run: |
          status=0
          for f in secrets/*.env; do
            # SOPS's dotenv format: every value is ENC[...], plus its own sops_* metadata.
            if ! grep -q '^sops_mac=' "$f" || grep -vE '^(#|$|sops_)' "$f" | grep -qv '=ENC\['; then
              echo "::error file=$f::not fully SOPS-encrypted; encrypt it with sops before committing"
              status=1
            fi
          done
          exit $status

  # Builds the images and checks the config baked into each. The infra images
  # have their program as the entrypoint, so `check` is just its args.
  image:
    name: test image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: caddy
            check: validate --config /etc/caddy/Caddyfile --adapter caddyfile
          - image: fluent-bit
            check: --dry-run --config /fluent-bit/etc/fluent-bit.yaml
          # Its flags; the step below starts it as compose does and checks the vmui dashboards baked into it.
          - image: victoria-metrics
            check: -dryRun
          # The broker itself: its CMD is overridden, and importing the submodule's code checks it was copied in and installed.
          - image: broker
            context: .
            check: python -c "import countdown_api.models"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build image
        run: docker build -t auth-broker-${{ matrix.image }} ${{ matrix.context || matrix.image }}

      - name: Check config
        run: docker run --rm auth-broker-${{ matrix.image }} ${{ matrix.check }}

      # The broker's image as docker-compose.yml runs it: the broker and each provider, with stand-in secrets and no
      # Redis, must start and then stop cleanly. Importing the code (above) isn't starting it: gunicorn checks
      # gunicorn.conf.py only as it starts.
      - name: Start its services
        if: matrix.image == 'broker'
        run: python3 scripts/check_image_starts.py auth-broker-broker

      # With the image's own CMD (loopback, host networking as in compose): every dashboard is served and every
      # query in it parses.
      - name: Check the vmui dashboards
        if: matrix.image == 'victoria-metrics'
        run: |
          docker run --detach --name check-victoria-metrics --network host auth-broker-victoria-metrics
          status=0
          python3 scripts/check_vmui_dashboards.py http://127.0.0.1:8428 || status=$?
          if [ "$status" -ne 0 ]; then docker logs check-victoria-metrics; fi
          docker rm --force check-victoria-metrics > /dev/null
          exit $status
