name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentik:
    name: validate Authentik config
    # Fork PRs cannot access deployment credentials. Never run untrusted PR code via
    # pull_request_target to give it access to production credentials.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up SSH
        env:
          ORACLE_SSH_TOKEN: ${{ secrets.ORACLE_SSH_TOKEN }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$ORACLE_SSH_TOKEN"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_TOKEN" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Validate against the running Authentik instance
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_IDENTITY_FILE: /home/runner/.ssh/id_deploy
        run: python scripts/validate_authentik_config.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest -v --cov=broker --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true

  # Everything in secrets/ is committed, so make sure no value in it is plaintext.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets are encrypted
        run: |
          status=0
          for f in secrets/*.env; do
            # SOPS's dotenv format: every value is ENC[...], plus its own sops_* metadata.
            if ! grep -q '^sops_mac=' "$f" || grep -vE '^(#|$|sops_)' "$f" | grep -qv '=ENC\['; then
              echo "::error file=$f::not fully SOPS-encrypted; encrypt it with sops before committing"
              status=1
            fi
          done
          exit $status

  # Builds each container image and checks the config baked into it. Every
  # image has its program as the entrypoint, so `check` is just its args.
  image:
    name: test image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: caddy
            check: validate --config /etc/caddy/Caddyfile --adapter caddyfile
          - image: fluent-bit
            check: --dry-run --config /fluent-bit/etc/fluent-bit.yaml
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t auth-broker-${{ matrix.image }} ${{ matrix.image }}

      - name: Check config
        run: docker run --rm auth-broker-${{ matrix.image }} ${{ matrix.check }}
