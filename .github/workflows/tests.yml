name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest -v --cov=broker --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true

  # Builds each container image and checks the config baked into it. Both
  # images have their program as the entrypoint, so `check` is just its args.
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: caddy
            check: validate --config /etc/caddy/Caddyfile --adapter caddyfile
          - image: fluent-bit
            check: --dry-run --config /fluent-bit/etc/fluent-bit.conf
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t auth-broker-${{ matrix.image }} ${{ matrix.image }}

      - name: Check config
        run: docker run --rm auth-broker-${{ matrix.image }} ${{ matrix.check }}
