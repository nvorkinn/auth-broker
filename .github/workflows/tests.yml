name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest -v --cov=broker --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true

  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Caddy image
        run: docker build -t auth-broker-caddy caddy

      - name: Validate Caddyfile
        run: docker run --rm auth-broker-caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
