name: Terraform

# Checks and plans terraform/ on pull requests that change it. The plan reads the live Authentik, so it needs the
# secrets below and is skipped without them (fork and Dependabot pull requests). Applies run only from a release tag:
# the Release workflow calls this with apply on, after deploy-authentik. The "Run workflow" button (Actions >
# Terraform) plans any ref, which shows drift; with "apply" ticked it also applies, on the latest release tag only,
# which is how a failed apply is retried. See terraform/README.md.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the plan after approval
        type: boolean
        default: false
  workflow_call:
    inputs:
      apply:
        type: boolean
        default: false
      # The release tag to plan and apply. A release started with the button runs on main, so github.ref isn't it.
      tag:
        type: string
        required: true

permissions:
  contents: read

# A new push to a PR replaces its running checks.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The release tag being planned, empty for a pull request or a button run on a branch. Apply needs one.
  TF_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  # Keep in step with required_version in terraform/versions.tf.
  TF_VERSION: 1.16.6
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugins
  # Where the state bucket is (Settings > Secrets and variables > Actions > Variables); see terraform/README.md.
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
  TF_STATE_ENDPOINT: ${{ vars.TF_STATE_ENDPOINT }}
  # Oracle's S3 API refuses the AWS SDK's default chunked, checksummed upload (501 "AWS chunked encoding not
  # supported"), so state can't be saved. These make the S3 backend send a plain upload instead.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

defaults:
  run:
    working-directory: terraform

# The checks and the plan run side by side. The checks run only on pull requests: a release's commit has passed them.
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - &setup-terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Provider downloads, reused until the lock file changes.
      - &provider-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # The Authentik provider insists on a token even to validate; nothing contacts the server.
      - name: Validate
        env:
          AUTHENTIK_TOKEN: validation-only
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -backend=false -lockfile=readonly
          terraform validate

  tflint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.63.1
          tflint_config_path: terraform/.tflint.hcl
          cache: true

      - name: Lint
        run: |
          tflint --init
          tflint --recursive --format compact

  # Misconfigurations (open security groups, unencrypted storage and the like). A finding that is wrong for this
  # setup is silenced with a `#trivy:ignore:<ID>` comment above the resource, saying why.
  trivy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Scan for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: terraform
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    outputs:
      # Whether the plan changes anything, so a release that leaves Authentik as it is asks for no approval.
      changes: ${{ steps.plan.outputs.changes }}
    # AUTHENTIK_TOKEN is the Authentik provider's own variable, and what scripts/authentik_ids.py reads. The plan only
    # needs to read, so the repository-level secret can be a read-only token; apply gets the terraform environment's.
    env:
      AUTHENTIK_TOKEN: ${{ secrets.AUTHENTIK_TOKEN }}
      # The state bucket's credentials: an Oracle customer secret key, read by the S3 backend under these names.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      HAVE_SECRETS: ${{ secrets.AUTHENTIK_TOKEN != '' && secrets.AWS_ACCESS_KEY_ID != '' }}
      TF_VAR_google_client_id: ${{ secrets.TF_VAR_GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.TF_VAR_GOOGLE_CLIENT_SECRET }}
      TF_VAR_logs_client_secret: ${{ secrets.TF_VAR_LOGS_CLIENT_SECRET }}
      TF_VAR_metrics_client_secret: ${{ secrets.TF_VAR_METRICS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TF_TAG }}

      # Applying an older tag would quietly put Authentik back to that release's config, so a retry has to be on the
      # latest one. Checked before planning, so a wrong pick fails at once rather than after an approval.
      - name: Check apply is on the latest release tag
        if: inputs.apply
        run: |
          [ -n "$TF_TAG" ] || { echo "::error::Apply runs from a release tag: pick the latest v* tag under \"Use workflow from\""; exit 1; }
          latest="$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'v*' \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          [ "$TF_TAG" = "$latest" ] || { echo "::error::$TF_TAG is not the latest release ($latest), so it isn't applied"; exit 1; }

      - *setup-terraform
      - *provider-cache

      - name: Skip the plan without secrets
        if: env.HAVE_SECRETS != 'true'
        env:
          APPLY: ${{ inputs.apply == true }}
        run: |
          [ "$APPLY" != true ] || { echo "::error::No AUTHENTIK_TOKEN or state credentials, so nothing can be planned or applied"; exit 1; }
          echo "::notice::No AUTHENTIK_TOKEN or state credentials here (a fork or Dependabot pull request, or not set up yet), so there is no plan."

      # Plans that won't be applied don't take the state lock, so they never hold up each other or an apply. Exit code
      # 2 from -detailed-exitcode means the plan has changes, 0 none.
      - name: Plan
        id: plan
        if: env.HAVE_SECRETS == 'true'
        env:
          LOCK: ${{ inputs.apply == true }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$TF_STATE_REGION" \
            -backend-config="endpoints={s3=\"$TF_STATE_ENDPOINT\"}"
          status=0
          terraform plan -lock="$LOCK" -detailed-exitcode -out=tfplan || status=$?
          [ "$status" -ne 1 ] || exit 1
          echo "changes=$([ "$status" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          terraform show -no-color tfplan > plan.txt
          { echo "### Terraform plan${TF_TAG:+ for $TF_TAG}"; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$status" -eq 2 ] || echo "::notice::No changes${TF_TAG:+ in $TF_TAG}, so there is nothing to apply."

      # One comment per PR, updated on each push. Fork and Dependabot PRs get a read-only token, so they only
      # have the job summary.
      - name: Comment the plan on the PR
        if: >-
          env.HAVE_SECRETS == 'true'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated, full plan in the job summary)';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n### Terraform plan\nFor ${context.payload.pull_request.head.sha} ([run](${run}))\n\n\`\`\`\n${plan}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number,
            });
            const mine = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Keep the plan for apply
        if: inputs.apply && steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

  # Applies exactly the plan above, after approval through the terraform environment's protection rule. If the
  # state changed in between, Terraform rejects the plan as stale and nothing is applied. A plan with no changes
  # skips this, approval included. The plan job has already checked TF_TAG is the latest release.
  apply:
    needs: plan
    if: inputs.apply && needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: terraform
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    # The environment's secret, which takes precedence over the repository's, so apply can use a token that
    # may write while plans use one that can only read.
    env:
      AUTHENTIK_TOKEN: ${{ secrets.AUTHENTIK_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TF_TAG }}

      # Local state would be thrown away with the runner, losing track of whatever was created.
      - name: Check state is remote
        run: |
          grep -qE '^\s*(backend\s+"|cloud\s*\{)' ./*.tf \
            || { echo "::error::No remote backend configured in terraform/backend.tf, so there is nowhere to keep state"; exit 1; }
          [ -n "$TF_STATE_BUCKET" ] || { echo "::error::The TF_STATE_BUCKET variable is not set"; exit 1; }

      - *setup-terraform
      - *provider-cache

      - uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: terraform

      # Terraform saves state only at the end of an apply, after Authentik has already changed, so find out now that the
      # bucket takes writes. A throwaway workspace is written, and removed, through the same code path as the state.
      - name: Check the state bucket accepts writes
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$TF_STATE_REGION" \
            -backend-config="endpoints={s3=\"$TF_STATE_ENDPOINT\"}"
          terraform workspace new "preflight-$GITHUB_RUN_ID"
          terraform workspace select default
          terraform workspace delete "preflight-$GITHUB_RUN_ID"

      - name: Apply
        run: terraform apply tfplan

      # If the bucket can't be reached, Terraform writes the state here instead. It holds secrets, so it is kept for a
      # day only: push it back with `terraform state push errored.tfstate`.
      - name: Keep the state of a failed apply
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: errored-tfstate
          path: terraform/errored.tfstate
          if-no-files-found: ignore
          retention-days: 1
