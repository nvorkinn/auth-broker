# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
  # Every Dockerfile: the broker's and each infra image's base.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/caddy"
      - "/fluent-bit"
      - "/victoria-logs"
      - "/victoria-metrics"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
  # Terraform providers and modules.
  - package-ecosystem: "terraform"
    directories:
      - "/terraform"
      - "/terraform/modules/*"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # vendor/countdown-api: a new commit of the API contract shows up as a PR, and the broker's build fails on it
  # until every route it adds is implemented.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
