version: 2
updates:
  # pyproject.toml and uv.lock. Ruff is also pinned in .pre-commit-config.yaml, which this doesn't update: keep it in step.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
  # Every Dockerfile: the broker's and each infra image's base.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/caddy"
      - "/fluent-bit"
      - "/victoria-logs"
      - "/victoria-metrics"
    schedule:
      interval: "daily"
    ignore:
      # The broker's Python moves with .python-version, by hand: a newer one than the tests run on goes untested, and
      # can lack wheels (pyyaml has none for 3.15, so it built from source, slowly under QEMU).
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
  # Terraform providers and modules.
  - package-ecosystem: "terraform"
    directories:
      - "/terraform"
      - "/terraform/modules/*"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # vendor/countdown-api: a new commit of the store contract shows up as a PR, which tests/test_store_contract.py
  # checks the broker against.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
