# Shared by the images this repo releases (ghcr.io/nvorkinn/auth-broker*),
# each pinned to a release tag in .env by deploy.sh.
x-release-image: &release-image
  pull_policy: always
  restart: unless-stopped

# Shared by every service. Fluent Bit reads the log files directly, and the tag (the container name,
# which is the service name here) becomes each record's `service`.
x-logging: &logging
  driver: json-file
  options:
    tag: "{{.Name}}"
    max-size: 10m
    max-file: "3"

# QA tracing of every request's headers, by the broker (broker/request_log.py) and by Caddy (the
# access_log snippet in caddy/Caddyfile). "true" turns both on. Read at start, so it takes
# `docker compose up -d`.
x-request-logging: &request-logging
  LOG_REQUEST_HEADERS: "false"

# Shared by the Authentik server and worker, which run the same image.
x-authentik: &authentik
  image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2026.8.4}
  restart: unless-stopped
  env_file: authentik.env
  environment:
    AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
    AUTHENTIK_POSTGRESQL__NAME: authentik
    AUTHENTIK_POSTGRESQL__USER: authentik
    # Email (sign-up confirmation, password recovery) through Resend's SMTP. The API key is the password,
    # AUTHENTIK_EMAIL__PASSWORD, in secrets/<environment>/authentik.env.
    AUTHENTIK_EMAIL__HOST: smtp.resend.com
    AUTHENTIK_EMAIL__PORT: "587"
    AUTHENTIK_EMAIL__USERNAME: resend
    AUTHENTIK_EMAIL__USE_TLS: "true"
    AUTHENTIK_EMAIL__USE_SSL: "false"
    AUTHENTIK_EMAIL__TIMEOUT: "30"
    AUTHENTIK_EMAIL__FROM: noreply@nikolaivorkinn.com
  depends_on:
    authentik-postgresql:
      condition: service_healthy
  shm_size: 512mb
  volumes:
    # Uploaded logos and backgrounds. Not /data: there, media is a symlink to /media in the
    # image, so uploads land in the container layer and vanish on every recreate.
    - authentik_media:/media

services:
  auth-broker:
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker:${AUTH_BROKER_VERSION:-latest}
    container_name: auth-broker
    logging: *logging
    # Host networking, to reach Redis, VictoriaLogs and VictoriaMetrics on loopback, as Caddy reaches
    # it. That would make the image's 0.0.0.0 bind public, so bind loopback.
    network_mode: host
    command: ["gunicorn", "--bind", "127.0.0.1:5000", "wsgi:app"]
    volumes:
      - ./data:/app/data
    # Decrypted from secrets/<environment>/ by deploy.sh, as are the other services' env_files.
    env_file:
      - broker.env
      - redis.env
    environment:
      <<: *request-logging
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: Lax
      SPOTIFY_REDIRECT_URI: https://auth.nikolaivorkinn.com/auth/spotify/callback

  # The music provider (broker/providers/music.py): what each screen's Spotify and Apple Music are playing, into
  # Redis. It starts the broker's app and writes refreshed Spotify tokens back, so ./data is writable here.
  spotify-provider:
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker:${AUTH_BROKER_VERSION:-latest}
    container_name: spotify-provider
    logging: *logging
    # Host networking, to reach Redis on 127.0.0.1:6379.
    network_mode: host
    command: ["python", "-m", "broker.providers.music"]
    volumes:
      - ./data:/app/data
    env_file:
      - broker.env
      - redis.env
    environment:
      SPOTIFY_REDIRECT_URI: https://auth.nikolaivorkinn.com/auth/spotify/callback
    stop_grace_period: 30s

  # The developer provider (broker/providers/developer.py): each screen's developer panel (GitHub and AI plans) into
  # Redis, and a pace hint while a release runs. It opens the database read-only (loop.read_only_app), so
  # ./data is mounted :ro.
  developer-provider:
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker:${AUTH_BROKER_VERSION:-latest}
    container_name: developer-provider
    logging: *logging
    # Host networking, to reach Redis on 127.0.0.1:6379.
    network_mode: host
    command: ["python", "-m", "broker.providers.developer"]
    volumes:
      - ./data:/app/data:ro
    # broker.env for the key that decrypts the GitHub tokens.
    env_file:
      - broker.env
      - redis.env
    stop_grace_period: 30s

  caddy:
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker-caddy:${CADDY_VERSION:-latest}
    container_name: caddy
    logging: *logging
    env_file: caddy.env
    environment:
      <<: *request-logging
    # Host networking, so 127.0.0.1 in the Caddyfile is the host (the broker on
    # :5000, authentik on :9000, VictoriaLogs on :9428, VictoriaMetrics on :8428),
    # and Caddy binds 80/443 (and UDP 443) directly.
    network_mode: host
    volumes:
      # Certificates and ACME account. Losing this makes Caddy re-request every
      # certificate, and Let's Encrypt rate-limits repeated issuance.
      - caddy_data:/data
      - caddy_config:/config

  # Fluent Bit, with fluent-bit/ baked in: container and OTLP logs to VictoriaLogs, host and OTLP metrics to
  # VictoriaMetrics.
  fluent-bit:
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker-fluent-bit:${FLUENT_BIT_VERSION:-latest}
    container_name: fluent-bit
    logging: *logging
    network_mode: host
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent-bit-state:/state

  # Logs: single-node VictoriaLogs on 127.0.0.1:9428, which Caddy serves at
  # logs.nikolaivorkinn.com: ingest with the ingest token, the UI to admins.
  victoria-logs:
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker-victoria-logs:${VICTORIA_LOGS_VERSION:-latest}
    container_name: victoria-logs
    logging: *logging
    network_mode: host
    # Shares the host's 6 GB with Authentik, like VictoriaMetrics.
    mem_limit: 512m
    volumes:
      - victoria_logs_data:/victoria-logs-data

  # Metrics: single-node VictoriaMetrics on 127.0.0.1:8428, which Caddy serves at
  # metrics.nikolaivorkinn.com: ingest with the ingest token, the UI to admins.
  victoria-metrics:
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker-victoria-metrics:${VICTORIA_METRICS_VERSION:-latest}
    container_name: victoria-metrics
    logging: *logging
    network_mode: host
    # The host's 6 GB is shared with Authentik. VictoriaMetrics sizes its caches
    # from this limit (60% of it by default).
    mem_limit: 512m
    volumes:
      - victoria_metrics_data:/victoria-metrics-data

  # The store shared with pi-dashboard (every key is in countdown-api). A cache only: everything in it is refetched
  # within minutes or rebuilt from the broker's database, so it keeps nothing on disk. Upstream's image, pinned
  # here. On 127.0.0.1:6379 with host networking, so the broker, its providers and pi-dashboard reach it on loopback.
  redis:
    image: docker.io/library/redis:8.10-alpine
    container_name: redis
    logging: *logging
    restart: unless-stopped
    network_mode: host
    # Not root. The image's entrypoint only drops to this user when the command is redis-server itself.
    user: redis
    env_file: redis.env
    # The config arrives on stdin (`redis-server -`), so the password never shows in the process list.
    # volatile-lru: when full, evict only keys with a TTL (the providers' data, refetched anyway), never
    # what has none (the subscriptions, which say what to fetch).
    command:
      - sh
      - -c
      - |
        exec redis-server - <<EOF
        bind 127.0.0.1
        port 6379
        protected-mode yes
        requirepass $$REDIS_PASSWORD
        save ""
        appendonly no
        maxmemory 128mb
        maxmemory-policy volatile-lru
        EOF
    mem_limit: 256m
    healthcheck:
      # REDISCLI_AUTH rather than -a, to keep the password out of the process list here too.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli -h 127.0.0.1 ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # The glow provider (broker/providers/glow.py): each screen's Glowmarkt readings into Redis. It decrypts the
  # Glowmarkt passwords with the broker's key (broker.env), so they never leave the broker, and opens the database
  # read-only. Host networking for Redis on 127.0.0.1:6379.
  glow-provider:
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker:${AUTH_BROKER_VERSION:-latest}
    container_name: glow-provider
    logging: *logging
    network_mode: host
    command: ["python", "-m", "broker.providers.glow"]
    volumes:
      - ./data:/app/data:ro
    env_file:
      - broker.env
      - redis.env
    depends_on:
      redis:
        condition: service_healthy

  # authentik: upstream's release, pinned by AUTHENTIK_VERSION in .env and
  # bumped by hand, one minor version at a time.
  authentik-postgresql:
    image: docker.io/library/postgres:18-alpine
    container_name: authentik-postgresql
    logging: *logging
    restart: unless-stopped
    env_file: authentik.env
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
    healthcheck:
      # $$ so the container's shell expands these, not Compose.
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      # Holds every user and passkey: back it up off the host.
      # Postgres 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker,
      # so mount the parent, not .../data.
      - authentik_db:/var/lib/postgresql

  authentik-server:
    <<: *authentik
    container_name: authentik-server
    logging: *logging
    command: server
    volumes:
      - authentik_media:/media
      # Served unauthenticated at /static/dist/assets/countdown/, so this must
      # hold brand assets only.
      - ./authentik-assets:/web/dist/assets/countdown:ro
    # Loopback only: Caddy (host networking) is the one way in, at
    # sso.nikolaivorkinn.com.
    ports:
      - "127.0.0.1:9000:9000"

  authentik-worker:
    <<: *authentik
    container_name: authentik-worker
    logging: *logging
    command: worker
    volumes:
      - authentik_media:/media

volumes:
  # Fixed names so the volumes don't depend on the compose project (directory) name.
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
  fluent-bit-state:
  authentik_db:
    name: authentik_db
  authentik_media:
    name: authentik_media
  victoria_logs_data:
    name: victoria_logs_data
  victoria_metrics_data:
    name: victoria_metrics_data
