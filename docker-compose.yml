# Shared by the images this repo releases (ghcr.io/nvorkinn/auth-broker*),
# each pinned to a release tag in .env by deploy.sh.
x-release-image: &release-image
  pull_policy: always
  restart: unless-stopped

# Shared by the Authentik server and worker, which run the same image.
x-authentik: &authentik
  image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2026.8.3}
  restart: unless-stopped
  env_file: authentik.env
  environment:
    AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
    AUTHENTIK_POSTGRESQL__NAME: authentik
    AUTHENTIK_POSTGRESQL__USER: authentik
  depends_on:
    authentik-postgresql:
      condition: service_healthy
  shm_size: 512mb
  volumes:
    - authentik_media:/data

services:
  auth-broker:
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker:${AUTH_BROKER_VERSION:-latest}
    container_name: auth-broker
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/app/data
    # Secrets, decrypted from secrets/broker.env by deploy.sh.
    env_file: broker.env
    environment:
      # The leading dot shares the pairing cookie with every subdomain (e.g. for
      # /api/logging_ui/verify behind logs.).
      SESSION_COOKIE_DOMAIN: .nikolaivorkinn.com
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: Lax
      SPOTIFY_REDIRECT_URI: https://auth.nikolaivorkinn.com/auth/spotify/callback

  caddy:
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker-caddy:${CADDY_VERSION:-latest}
    container_name: caddy
    # Caddy's own secrets, decrypted from secrets/caddy.env by deploy.sh.
    env_file: caddy.env
    # Host networking, so 127.0.0.1 in the Caddyfile is the host: the broker is
    # published on 127.0.0.1:5000, and VictoriaLogs and VictoriaMetrics listen
    # on 127.0.0.1:9428 and 127.0.0.1:8428. Caddy binds 80/443 (and UDP 443) on
    # the host directly.
    network_mode: host
    volumes:
      # Certificates and ACME account. Losing this makes Caddy re-request every
      # certificate, and Let's Encrypt rate-limits repeated issuance.
      - caddy_data:/data
      - caddy_config:/config

  # Ships every container's logs to VictoriaLogs (127.0.0.1:9428).
  fluent-bit:
    # Fluent Bit with this repo's fluent-bit/ config baked in.
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker-fluent-bit:${FLUENT_BIT_VERSION:-latest}
    container_name: fluent-bit
    network_mode: host
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent-bit-state:/state

  # Logs. Upstream's single-node VictoriaLogs. It listens on 127.0.0.1:9428
  # (host networking, like Fluent Bit and Caddy) and Caddy serves it at
  # logs.nikolaivorkinn.com: ingest with the ingest token, the UI to admins.
  victoria-logs:
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker-victoria-logs:${VICTORIA_LOGS_VERSION:-latest}
    container_name: victoria-logs
    network_mode: host
    # Shares the host's 6 GB with Authentik, like VictoriaMetrics.
    mem_limit: 512m
    volumes:
      - victoria_logs_data:/victoria-logs-data

  # Metrics. Upstream's single-node VictoriaMetrics; it scrapes nothing, metrics
  # are pushed to it. It listens on 127.0.0.1:8428 (host networking, like
  # Fluent Bit and Caddy) and Caddy serves it at metrics.nikolaivorkinn.com:
  # ingest with the ingest token, the UI to admins.
  victoria-metrics:
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker-victoria-metrics:${VICTORIA_METRICS_VERSION:-latest}
    container_name: victoria-metrics
    network_mode: host
    # The host's 6 GB is shared with Authentik. VictoriaMetrics sizes its caches
    # from this limit (60% of it by default).
    mem_limit: 512m
    volumes:
      - victoria_metrics_data:/victoria-metrics-data

  # Authentik (SSO with passkeys). All three read their secrets from
  # authentik.env, decrypted from secrets/authentik.env by deploy.sh.
  # AUTHENTIK_VERSION in .env pins the upstream release; bump it by hand,
  # one minor version at a time.
  authentik-postgresql:
    image: docker.io/library/postgres:18-alpine
    container_name: authentik-postgresql
    restart: unless-stopped
    env_file: authentik.env
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
    healthcheck:
      # $$ so the container's shell expands these, not Compose.
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      # Holds every user and passkey: back it up off the host.
      # Postgres 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker,
      # so mount the parent, not .../data.
      - authentik_db:/var/lib/postgresql

  authentik-server:
    <<: *authentik
    container_name: authentik-server
    command: server
    # Loopback only: Caddy (host networking) is the one way in, at
    # sso.nikolaivorkinn.com.
    ports:
      - "127.0.0.1:9000:9000"

  authentik-worker:
    <<: *authentik
    container_name: authentik-worker
    command: worker

volumes:
  # Fixed names so the volumes don't depend on the compose project (directory) name.
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
  fluent-bit-state:
  authentik_db:
    name: authentik_db
  authentik_media:
    name: authentik_media
  victoria_logs_data:
    name: victoria_logs_data
  victoria_metrics_data:
    name: victoria_metrics_data
