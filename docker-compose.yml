# Shared by the images this repo releases (ghcr.io/nvorkinn/auth-broker*),
# each pinned to a release tag in .env by deploy.sh.
x-release-image: &release-image
  pull_policy: always
  restart: unless-stopped

# Shared by every service. Fluent Bit reads the log files directly and uses the tag (the container
# name, which is the service name here) as the `service` field: it appears as attrs.tag in each record.
x-logging: &logging
  driver: json-file
  options:
    tag: "{{.Name}}"
    max-size: 10m
    max-file: "3"

# QA tracing of every request's headers, by the broker (broker/request_log.py) and by Caddy (the
# access_log snippet in caddy/Caddyfile). "true" turns both on, anything else leaves both off.
# Read at start, so it takes a restart of the two containers (`docker compose up -d`).
x-request-logging: &request-logging
  LOG_REQUEST_HEADERS: "false"

# Shared by the Authentik server and worker, which run the same image.
x-authentik: &authentik
  image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2026.8.4}
  restart: unless-stopped
  env_file: authentik.env
  environment:
    AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
    AUTHENTIK_POSTGRESQL__NAME: authentik
    AUTHENTIK_POSTGRESQL__USER: authentik
    # Outgoing email (the sign-up's confirmation link, password recovery) through Resend's SMTP. The API
    # key is the password, AUTHENTIK_EMAIL__PASSWORD, in secrets/authentik.env.
    AUTHENTIK_EMAIL__HOST: smtp.resend.com
    AUTHENTIK_EMAIL__PORT: "587"
    AUTHENTIK_EMAIL__USERNAME: resend
    AUTHENTIK_EMAIL__USE_TLS: "true"
    AUTHENTIK_EMAIL__USE_SSL: "false"
    AUTHENTIK_EMAIL__TIMEOUT: "30"
    AUTHENTIK_EMAIL__FROM: noreply@nikolaivorkinn.com
  depends_on:
    authentik-postgresql:
      condition: service_healthy
  shm_size: 512mb
  volumes:
    # Uploaded logos and backgrounds. Not /data: there, media is a symlink to /media in the
    # image, so uploads land in the container layer and vanish on every recreate.
    - authentik_media:/media

services:
  auth-broker:
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker:${AUTH_BROKER_VERSION:-latest}
    container_name: auth-broker
    logging: *logging
    # Host networking, so it can reach VictoriaLogs (127.0.0.1:9428, logs) and VictoriaMetrics
    # (127.0.0.1:8428, metrics), like Caddy reaches it. That makes the image's 0.0.0.0 bind public,
    # so bind loopback.
    network_mode: host
    command: ["gunicorn", "--bind", "127.0.0.1:5000", "wsgi:app"]
    volumes:
      - ./data:/app/data
    # Secrets, decrypted from secrets/broker.env by deploy.sh; and Redis's password (REDIS_PASSWORD, from
    # secrets/redis.env), for writing the subscriptions to Redis.
    env_file:
      - broker.env
      - redis.env
    environment:
      <<: *request-logging
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: Lax
      SPOTIFY_REDIRECT_URI: https://auth.nikolaivorkinn.com/auth/spotify/callback

  # The music provider: what each screen's Spotify and Apple Music are playing, written to Redis for the renderers
  # (see "Music in the store" in the README). The broker's image and settings, as it uses the broker's database and
  # Spotify code (and writes refreshed tokens back to it). Deployed with the broker (deploy.sh's auth-broker), on the
  # same AUTH_BROKER_VERSION.
  spotify-provider:
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker:${AUTH_BROKER_VERSION:-latest}
    container_name: spotify-provider
    logging: *logging
    # Host networking, to reach Redis on 127.0.0.1:6379 (and VictoriaLogs, like the broker).
    network_mode: host
    command: ["python", "-m", "broker.spotify_provider"]
    volumes:
      - ./data:/app/data
    # The broker's secrets, decrypted from secrets/broker.env by deploy.sh; and Redis's password (REDIS_PASSWORD,
    # from secrets/redis.env), for writing to Redis.
    env_file:
      - broker.env
      - redis.env
    environment:
      SPOTIFY_REDIRECT_URI: https://auth.nikolaivorkinn.com/auth/spotify/callback
    stop_grace_period: 30s

  caddy:
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker-caddy:${CADDY_VERSION:-latest}
    container_name: caddy
    logging: *logging
    # Caddy's own secrets, decrypted from secrets/caddy.env by deploy.sh.
    env_file: caddy.env
    environment:
      <<: *request-logging
    # Host networking, so 127.0.0.1 in the Caddyfile is the host: the broker is
    # published on 127.0.0.1:5000, and VictoriaLogs and VictoriaMetrics listen
    # on 127.0.0.1:9428 and 127.0.0.1:8428. Caddy binds 80/443 (and UDP 443) on
    # the host directly.
    network_mode: host
    volumes:
      # Certificates and ACME account. Losing this makes Caddy re-request every
      # certificate, and Let's Encrypt rate-limits repeated issuance.
      - caddy_data:/data
      - caddy_config:/config

  # Ships every container's logs to VictoriaLogs (127.0.0.1:9428).
  fluent-bit:
    # Fluent Bit with this repo's fluent-bit/ config baked in.
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker-fluent-bit:${FLUENT_BIT_VERSION:-latest}
    container_name: fluent-bit
    logging: *logging
    network_mode: host
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent-bit-state:/state

  # Logs. Upstream's single-node VictoriaLogs. It listens on 127.0.0.1:9428
  # (host networking, like Fluent Bit and Caddy) and Caddy serves it at
  # logs.nikolaivorkinn.com: ingest with the ingest token, the UI to admins.
  victoria-logs:
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker-victoria-logs:${VICTORIA_LOGS_VERSION:-latest}
    container_name: victoria-logs
    logging: *logging
    network_mode: host
    # Shares the host's 6 GB with Authentik, like VictoriaMetrics.
    mem_limit: 512m
    volumes:
      - victoria_logs_data:/victoria-logs-data

  # Metrics. Upstream's single-node VictoriaMetrics; it scrapes nothing, metrics
  # are pushed to it. It listens on 127.0.0.1:8428 (host networking, like
  # Fluent Bit and Caddy) and Caddy serves it at metrics.nikolaivorkinn.com:
  # ingest with the ingest token, the UI to admins.
  victoria-metrics:
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker-victoria-metrics:${VICTORIA_METRICS_VERSION:-latest}
    container_name: victoria-metrics
    logging: *logging
    network_mode: host
    # The host's 6 GB is shared with Authentik. VictoriaMetrics sizes its caches
    # from this limit (60% of it by default).
    mem_limit: 512m
    volumes:
      - victoria_metrics_data:/victoria-metrics-data

  # The shared store between the API providers (they write the latest data per stop, location, ...) and the
  # renderers (they read it), with the broker writing what to fetch. A cache only: everything in it is either
  # refetched within minutes or rebuilt from the broker's database, so it keeps nothing on disk. Upstream's
  # image, pinned here and bumped by hand. It listens on 127.0.0.1:6379 (host networking, like the Victoria
  # services, so the broker and the renderers reach it on loopback) and wants REDIS_PASSWORD, from redis.env.
  redis:
    image: docker.io/library/redis:8.10-alpine
    container_name: redis
    logging: *logging
    restart: unless-stopped
    network_mode: host
    # Not root. The image's entrypoint only drops to this user when the command is redis-server itself.
    user: redis
    env_file: redis.env
    # The config arrives on stdin (`redis-server -`), so the password never shows in the process list.
    # volatile-lru: when full, evict only keys with a TTL (the providers' data, refetched anyway), never
    # what has none (the subscriptions, which say what to fetch).
    command:
      - sh
      - -c
      - |
        exec redis-server - <<EOF
        bind 127.0.0.1
        port 6379
        protected-mode yes
        requirepass $$REDIS_PASSWORD
        save ""
        appendonly no
        maxmemory 128mb
        maxmemory-policy volatile-lru
        EOF
    mem_limit: 256m
    healthcheck:
      # REDISCLI_AUTH rather than -a, to keep the password out of the process list here too.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli -h 127.0.0.1 ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # The glow-provider (broker/providers/glow.py): every Glow device's energy readings, from Glowmarkt into Redis as
  # v1:energy:<device id>. The broker's own image with another command, so it decrypts the Glowmarkt passwords with
  # the broker's key (broker.env) and they never leave the broker; it opens the database read-only. Host networking
  # for Redis on 127.0.0.1:6379, with REDIS_PASSWORD from redis.env. Deployed with the broker (deploy.sh's auth-broker),
  # on the same AUTH_BROKER_VERSION.
  glow-provider:
    <<: *release-image
    image: ghcr.io/nvorkinn/auth-broker:${AUTH_BROKER_VERSION:-latest}
    container_name: glow-provider
    logging: *logging
    network_mode: host
    command: ["python", "-m", "broker.providers.glow"]
    volumes:
      - ./data:/app/data:ro
    env_file:
      - broker.env
      - redis.env
    depends_on:
      redis:
        condition: service_healthy

  # Authentik (SSO with passkeys). All three read their secrets from
  # authentik.env, decrypted from secrets/authentik.env by deploy.sh.
  # AUTHENTIK_VERSION in .env pins the upstream release; bump it by hand,
  # one minor version at a time.
  authentik-postgresql:
    image: docker.io/library/postgres:18-alpine
    container_name: authentik-postgresql
    logging: *logging
    restart: unless-stopped
    env_file: authentik.env
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
    healthcheck:
      # $$ so the container's shell expands these, not Compose.
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      # Holds every user and passkey: back it up off the host.
      # Postgres 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker,
      # so mount the parent, not .../data.
      - authentik_db:/var/lib/postgresql

  authentik-server:
    <<: *authentik
    container_name: authentik-server
    logging: *logging
    command: server
    volumes:
      - authentik_media:/media
      # Served unauthenticated at /static/dist/assets/countdown/, so this must
      # hold brand assets only.
      - ./authentik-assets:/web/dist/assets/countdown:ro
    # Loopback only: Caddy (host networking) is the one way in, at
    # sso.nikolaivorkinn.com.
    ports:
      - "127.0.0.1:9000:9000"

  authentik-worker:
    <<: *authentik
    container_name: authentik-worker
    logging: *logging
    command: worker
    volumes:
      - authentik_media:/media

volumes:
  # Fixed names so the volumes don't depend on the compose project (directory) name.
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
  fluent-bit-state:
  authentik_db:
    name: authentik_db
  authentik_media:
    name: authentik_media
  victoria_logs_data:
    name: victoria_logs_data
  victoria_metrics_data:
    name: victoria_metrics_data
