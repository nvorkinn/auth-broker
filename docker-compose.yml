services:
  auth-broker:
    image: ghcr.io/nvorkinn/auth-broker:${AUTH_BROKER_VERSION:-latest}
    container_name: auth-broker
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/app/data
    env_file: .env

  caddy:
    image: ghcr.io/nvorkinn/auth-broker-caddy:${CADDY_VERSION:-latest}
    container_name: caddy
    pull_policy: always
    restart: unless-stopped
    # Caddy's own secrets, kept apart from the broker's .env.
    env_file: caddy.env
    # Host networking, so 127.0.0.1 in the Caddyfile is the host: VictoriaLogs
    # (127.0.0.1:9428) runs there outside compose, and the broker is published
    # on 127.0.0.1:5000. Caddy binds 80/443 (and UDP 443) on the host directly.
    network_mode: host
    volumes:
      # Certificates and ACME account. Losing this makes Caddy re-request every
      # certificate, and Let's Encrypt rate-limits repeated issuance.
      - caddy_data:/data
      - caddy_config:/config

  # Ships every container's logs to VictoriaLogs on the host (127.0.0.1:9428).
  fluent-bit:
    # Fluent Bit with this repo's fluent-bit/ config baked in.
    image: ghcr.io/nvorkinn/auth-broker-fluent-bit:${FLUENT_BIT_VERSION:-latest}
    container_name: fluent-bit
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent-bit-state:/state

  postgresql:
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-authentik}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    volumes:
      - database:/var/lib/postgresql/data

  authentik-server:
    command: server
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2026.8.3}
    ports:
      - 9000:9000
      - 9443:9443
    restart: unless-stopped
    shm_size: 512mb
    volumes:
      - ./data:/data
      - ./custom-templates:/templates

  authentik-worker:
    command: worker
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2026.8.3}
    restart: unless-stopped
    shm_size: 512mb
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./certs:/certs
      - ./custom-templates:/templates

volumes:
  # Fixed names so the volumes don't depend on the compose project (directory) name.
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
  fluent-bit-state:
