[project]
name = "countdown-server"
# Releases are git tags (see .github/workflows/release.yml), not this; nothing builds a package from it.
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "flask",
    "requests",
    "gunicorn",
    "cryptography",
    "flask-sqlalchemy",
    "flask-migrate",
    "sqlalchemy",
    "alembic",
    "werkzeug",
    "click",
    "maxminddb",
    "pydantic",
    # Reads workflow files for the release graphs (broker/clients/workflow_graph.py).
    "pyyaml",
    "redis",
    # The IANA time zones for zoneinfo (the glow-provider asks Glowmarkt in each screen's), whatever the image has.
    "tzdata",
    # The store contract: the vendor/countdown-api submodule (see [tool.uv.sources]).
    "countdown-api",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    # CI splits the tests across parallel jobs: `--num-shards N --shard-id I` runs one share of them.
    "pytest-shard",
    # lua: the render queue's script (services/render_jobs.py) runs in fakeredis too.
    "fakeredis[lua]",
    "responses",
    # Keep in step with the ruff-pre-commit rev in .pre-commit-config.yaml.
    "ruff==0.17.1",
    # Keep in step with the ty-pre-commit rev in .pre-commit-config.yaml.
    "ty==0.0.91",
]

[tool.uv]
# An app, not a library: `uv sync` installs its dependencies, never the broker itself.
package = false

[tool.uv.sources]
countdown-api = { path = "vendor/countdown-api", editable = true }

[tool.ty.src]
# vendor/ is the countdown-api submodule: type checked by its own repository (its package still resolves, from .venv).
exclude = ["vendor"]
