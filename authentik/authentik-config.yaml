# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Only what this repo owns. Authentik's own default and system blueprints create the
# stock flows, stages, policies, mappings and groups; this file looks them up by
# name or slug (!Find) and patches the few it customises. Blueprints only create and
# update, so removing an entry here doesn't delete the object from Authentik.
version: 1
metadata:
  name: auth-broker
  labels:
    # Applied only by the approved deploy-authentik-config job, not by the
    # worker's own blueprint discovery.
    blueprints.goauthentik.io/instantiate: 'false'
entries:
  # Recovery flow (email link, then TOTP or WebAuthn, then a new password).
  - model: authentik_flows.flow
    id: recovery-flow
    state: present
    identifiers:
      slug: default-recovery-flow
    attrs:
      name: Default recovery flow
      title: Reset your password
      designation: recovery
      authentication: require_unauthenticated
      layout: stacked
      policy_engine_mode: any
  - model: authentik_stages_prompt.prompt
    id: recovery-field-password
    state: present
    identifiers:
      name: default-recovery-field-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      order: 0
  - model: authentik_stages_prompt.prompt
    id: recovery-field-password-repeat
    state: present
    identifiers:
      name: default-recovery-field-password-repeat
    attrs:
      field_key: password_repeat
      label: Password (repeat)
      type: password
      required: true
      placeholder: Password (repeat)
      order: 1
  - model: authentik_policies_expression.expressionpolicy
    id: recovery-skip-if-restored
    state: present
    identifiers:
      name: default-recovery-skip-if-restored
    attrs:
      expression: |
        return bool(request.context.get('is_restored', True))
  - model: authentik_stages_email.emailstage
    id: recovery-email
    state: present
    identifiers:
      name: default-recovery-email
    attrs:
      use_global_settings: true
      subject: Password reset
      template: email/password_reset.html
      token_expiry: minutes=30
      activate_user_on_success: false
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: recovery-mfa
    state: present
    identifiers:
      name: default-recovery-mfa
    attrs:
      device_classes:
        - totp
        - webauthn
      not_configured_action: deny
      last_auth_threshold: seconds=0
      webauthn_user_verification: preferred
  - model: authentik_stages_user_write.userwritestage
    id: recovery-user-write
    state: present
    identifiers:
      name: default-recovery-user-write
    attrs:
      user_creation_mode: never_create
      user_type: external
  - model: authentik_stages_identification.identificationstage
    id: recovery-identification
    state: present
    identifiers:
      name: default-recovery-identification
    attrs:
      user_fields:
        - email
        - username
      case_insensitive_matching: true
      pretend_user_exists: true
      show_matched_user: true
  - model: authentik_stages_user_login.userloginstage
    id: recovery-user-login
    state: present
    identifiers:
      name: default-recovery-user-login
  - model: authentik_stages_prompt.promptstage
    id: recovery-prompt-password
    state: present
    identifiers:
      name: default-recovery-prompt-password
    attrs:
      fields:
        - !KeyOf recovery-field-password
        - !KeyOf recovery-field-password-repeat
      validation_policies:
        - !Find [authentik_policies_password.passwordpolicy, [name, default-password-change-password-policy]]
  - model: authentik_flows.flowstagebinding
    id: recovery-binding-identification
    state: present
    identifiers:
      target: !KeyOf recovery-flow
      stage: !KeyOf recovery-identification
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf recovery-flow
      stage: !KeyOf recovery-email
      order: 20
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf recovery-flow
      stage: !KeyOf recovery-mfa
      order: 21
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf recovery-flow
      stage: !KeyOf recovery-prompt-password
      order: 30
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf recovery-flow
      stage: !KeyOf recovery-user-write
      order: 40
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf recovery-flow
      stage: !KeyOf recovery-user-login
      order: 100
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      policy: !KeyOf recovery-skip-if-restored
      target: !KeyOf recovery-binding-identification
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30

  # Sign-up: username, email and password, then a link emailed to that address that has to be followed,
  # then a second factor that has to be set up (a passkey or an authenticator app) before the account
  # logs in. A passkey also lets that user sign in later without typing a username. Only offered to a
  # visitor who was sent to sign in from the broker's /pair page: the gate reads where the login
  # will return to. That keeps the sign-up off the Logs and Metrics logins and off the login page
  # in general, but it isn't a security boundary, as anyone can forge the query. What keeps a new
  # account out of Logs and Metrics is their group bindings. A new user is a plain internal user
  # in no group, which the broker accepts.
  - model: authentik_flows.flow
    id: broker-enrollment-flow
    state: present
    identifiers:
      slug: broker-enrollment
    attrs:
      name: Broker sign-up
      title: Create your account
      designation: enrollment
      authentication: require_unauthenticated
      layout: stacked
      policy_engine_mode: any
  - model: authentik_policies_expression.expressionpolicy
    id: broker-enrollment-gate
    state: present
    identifiers:
      name: broker-enrollment-from-broker
    attrs:
      expression: |
        import base64
        import json
        from urllib.parse import parse_qs, urlparse

        # The sign-in's `state` is a token from the proxy that carries the page to return to.
        http_request = request.http_request
        query = parse_qs(http_request.GET.get("query", "")) if http_request else {}
        state = (query.get("state") or [""])[0]
        try:
            payload = state.split(".")[1]
            claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
            target = urlparse(claims.get("redirect", ""))
        except (IndexError, ValueError, TypeError, AttributeError):
            return False
        return target.hostname == "auth.nikolaivorkinn.com" and target.path == "/pair"
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      policy: !KeyOf broker-enrollment-gate
      target: !KeyOf broker-enrollment-flow
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
  - model: authentik_stages_prompt.prompt
    id: enrollment-field-username
    state: present
    identifiers:
      name: broker-enrollment-field-username
    attrs:
      field_key: username
      label: Username
      type: username
      required: true
      placeholder: Username
      order: 0
  - model: authentik_stages_prompt.prompt
    id: enrollment-field-email
    state: present
    identifiers:
      name: broker-enrollment-field-email
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: Email
      order: 1
  - model: authentik_stages_prompt.prompt
    id: enrollment-field-password
    state: present
    identifiers:
      name: broker-enrollment-field-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      order: 2
  - model: authentik_stages_prompt.prompt
    id: enrollment-field-password-repeat
    state: present
    identifiers:
      name: broker-enrollment-field-password-repeat
    attrs:
      field_key: password_repeat
      label: Password (repeat)
      type: password
      required: true
      placeholder: Password (repeat)
      order: 3
  - model: authentik_stages_prompt.promptstage
    id: enrollment-prompt
    state: present
    identifiers:
      name: broker-enrollment-prompt
    attrs:
      fields:
        - !KeyOf enrollment-field-username
        - !KeyOf enrollment-field-email
        - !KeyOf enrollment-field-password
        - !KeyOf enrollment-field-password-repeat
      validation_policies:
        - !Find [authentik_policies_password.passwordpolicy, [name, default-password-change-password-policy]]
  - model: authentik_stages_user_write.userwritestage
    id: enrollment-user-write
    state: present
    identifiers:
      name: broker-enrollment-user-write
    attrs:
      user_creation_mode: always_create
      user_type: internal
      # Inactive until the emailed link is followed (the email stage activates it).
      create_users_as_inactive: true
  # Email verification: a link goes to the address given, and the account only becomes active when it is
  # followed. The SMTP settings are Authentik's global ones (AUTHENTIK_EMAIL__* in docker-compose.yml,
  # with the password in secrets/authentik.env), the same ones the recovery flow uses.
  - model: authentik_stages_email.emailstage
    id: enrollment-email
    state: present
    identifiers:
      name: broker-enrollment-email
    attrs:
      use_global_settings: true
      subject: Confirm your email
      template: email/account_confirmation.html
      token_expiry: minutes=30
      activate_user_on_success: true
  # A second factor is mandatory: with none set up, the user has to set up a passkey or an authenticator
  # app now (the stock setup stages), and can't carry on without one.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: enrollment-mfa
    state: present
    identifiers:
      name: broker-enrollment-mfa
    attrs:
      device_classes:
        - webauthn
        - totp
      not_configured_action: configure
      last_auth_threshold: seconds=0
      webauthn_user_verification: required
      configuration_stages:
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
  - model: authentik_stages_user_login.userloginstage
    id: enrollment-user-login
    state: present
    identifiers:
      name: broker-enrollment-user-login
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf broker-enrollment-flow
      stage: !KeyOf enrollment-prompt
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf broker-enrollment-flow
      stage: !KeyOf enrollment-user-write
      order: 20
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf broker-enrollment-flow
      stage: !KeyOf enrollment-email
      order: 25
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf broker-enrollment-flow
      stage: !KeyOf enrollment-mfa
      order: 30
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf broker-enrollment-flow
      stage: !KeyOf enrollment-user-login
      order: 100
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false

  # Passkey login: a WebAuthn-only validation stage on the login screen's identification stage.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: passkey-validation
    state: present
    identifiers:
      name: default-authentication-passkey-validation
    attrs:
      device_classes:
        - webauthn
      not_configured_action: deny
      last_auth_threshold: seconds=0
      webauthn_user_verification: required
      webauthn_allowed_device_types: []
      webauthn_hints: []
  - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
    state: present
    identifiers:
      name: default-authenticator-webauthn-setup
    attrs:
      resident_key_requirement: required
      user_verification: required

  # Brands: point both at the recovery flow; nikolaivorkinn.com carries the branding.
  - model: authentik_brands.brand
    state: present
    identifiers:
      domain: authentik-default
    attrs:
      flow_recovery: !KeyOf recovery-flow
  - model: authentik_brands.brand
    state: present
    identifiers:
      domain: nikolaivorkinn.com
    attrs:
      branding_title: Countdown
      branding_logo: /static/dist/assets/countdown/countdown-pill.svg
      branding_favicon: countdown-favicon.svg.svg
      branding_default_flow_background: 820461.jpg
      flow_recovery: !KeyOf recovery-flow

  # Forward-auth for the Logs and Metrics UIs through the embedded outpost. The proxy
  # provider comes first: it is an OAuth2 provider, so the OAuth2 entry then finds it
  # by name and sets its client credentials and redirect URIs.
  - model: authentik_providers_proxy.proxyprovider
    id: logs-proxy-provider
    state: present
    identifiers:
      name: Provider for Logs
    attrs: &proxy-attrs
      mode: forward_single
      intercept_header_auth: true
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings: &oauth-mappings
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Application Entitlements"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Proxy outpost"]]
      external_host: https://logs.nikolaivorkinn.com
  - model: authentik_providers_proxy.proxyprovider
    id: metrics-proxy-provider
    state: present
    identifiers:
      name: Provider for Metrics
    attrs:
      <<: *proxy-attrs
      external_host: https://metrics.nikolaivorkinn.com
  - model: authentik_providers_proxy.proxyprovider
    id: broker-proxy-provider
    state: present
    identifiers:
      name: Provider for Broker
    attrs:
      <<: *proxy-attrs
      external_host: https://auth.nikolaivorkinn.com
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: Provider for Logs
    attrs: &oauth-attrs
      client_type: confidential
      client_id: 8Knwigt49WR5g5n3HpJ2Z1NwUZDEIXklKb4gXj55
      client_secret: !Env BLUEPRINT_LOGS_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings: *oauth-mappings
      grant_types:
        - authorization_code
        - client_credentials
        - password
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://logs.nikolaivorkinn.com/outpost.goauthentik.io/callback?X-authentik-auth-callback=true
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://logs.nikolaivorkinn.com?X-authentik-auth-callback=true
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: Provider for Metrics
    attrs:
      <<: *oauth-attrs
      client_id: 8Q9k5OULc2hhSC7Fs67ApkxhUncoPONpRyHQPgFa
      client_secret: !Env BLUEPRINT_METRICS_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://metrics.nikolaivorkinn.com/outpost.goauthentik.io/callback?X-authentik-auth-callback=true
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://metrics.nikolaivorkinn.com?X-authentik-auth-callback=true
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: Provider for Broker
    attrs:
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://auth.nikolaivorkinn.com/outpost.goauthentik.io/callback?X-authentik-auth-callback=true
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://auth.nikolaivorkinn.com?X-authentik-auth-callback=true
  # No group binding: any signed-in user may use the broker's pairing and config pages.
  - model: authentik_core.application
    state: present
    identifiers:
      slug: broker
    attrs:
      name: Broker
      meta_icon: /static/dist/assets/countdown/countdown-pill.svg
      provider: !KeyOf broker-proxy-provider
  - model: authentik_core.application
    state: present
    identifiers:
      slug: logs
    attrs:
      name: Logs
      meta_icon: /static/dist/assets/countdown/countdown-pill.svg
      provider: !KeyOf logs-proxy-provider
  - model: authentik_core.application
    id: metrics-app
    state: present
    identifiers:
      slug: metrics
    attrs:
      name: Metrics
      meta_icon: /static/dist/assets/countdown/countdown-pill.svg
      provider: !KeyOf metrics-proxy-provider
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      group: !Find [authentik_core.group, [name, authentik Admins]]
      target: !KeyOf metrics-app
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
  - model: authentik_outposts.outpost
    state: present
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      name: authentik Embedded Outpost
      type: proxy
      config:
        authentik_host: https://sso.nikolaivorkinn.com
      providers:
        - !KeyOf logs-proxy-provider
        - !KeyOf metrics-proxy-provider
        - !KeyOf broker-proxy-provider

  # Google as a federated login source.
  - model: authentik_sources_oauth.oauthsource
    id: google-source
    state: present
    identifiers:
      slug: google
    attrs:
      name: Google
      enabled: true
      provider_type: google
      consumer_key: !Env BLUEPRINT_GOOGLE_CLIENT_ID
      consumer_secret: !Env BLUEPRINT_GOOGLE_CLIENT_SECRET
      authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
      enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]
      user_matching_mode: email_link
      user_path_template: goauthentik.io/sources/%(slug)s

  # Show Google on the login screen: the source alone only exists, the
  # identification stage decides which sources it lists.
  - model: authentik_stages_identification.identificationstage
    state: present
    identifiers:
      name: default-authentication-identification
    attrs:
      user_fields:
        - email
        - username
      recovery_flow: !KeyOf recovery-flow
      enrollment_flow: !KeyOf broker-enrollment-flow
      webauthn_stage: !KeyOf passkey-validation
      sources:
        - !KeyOf google-source
