# Who can decrypt secrets/*.env: Nikolai's laptop (to edit them with
# `sops secrets/<file>.env`) and the host (to decrypt them at deploy time, with
# /opt/auth-broker/age.key). After changing this list, re-encrypt each file to
# it with `sops updatekeys secrets/<file>.env`.
creation_rules:
  - path_regex: ^secrets/[^/]+\.env$
    age: >-
      age10ekvquu5g773glj5a24ht3uaegdm6atkv7el8nmql4jyvtr3fgeqyxvfuy,
      HOST_AGE_PUBLIC_KEY
