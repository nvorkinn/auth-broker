service:
  flush: 1
  log_level: info
  parsers_file: parsers.yaml

pipeline:
  inputs:
    - name: tail
      path: /var/lib/docker/containers/*/*-json.log
      parser: docker
      tag: docker_logs
      db: /state/docker-logs.db
      mem_buf_limit: 16MB
      skip_long_lines: on
      refresh_interval: 10
    # OTLP/HTTP (the render pool's). With no tag set, the URI path becomes the tag (/v1/logs,
    # /v1/metrics), which the outputs below match on.
    - name: opentelemetry
      listen: 127.0.0.1
      port: 4318
    - name: fluentbit_metrics
      tag: telemetry
      scrape_interval: 30
    # Only the collectors that work in a container on this host: the defaults also include cpufreq
    # (no /sys/.../cpufreq here) and systemd (no D-Bus socket), which log errors on every start.
    - name: node_exporter_metrics
      tag: telemetry
      metrics: cpu,meminfo,loadavg,filesystem,diskstats,netdev,uname,time
      scrape_interval: 30

  filters:
    # JSON log lines (the broker, Caddy, authentik, ...) get their fields lifted, so `level` and `_msg`
    # reach VictoriaLogs as the app wrote them; other lines keep their text in `log`.
    - name: parser
      match: docker_logs
      key_name: log
      parser: json_log
      reserve_data: on
      preserve_key: off
    # Docker puts the container's log tag (its name, from the compose logging options) in attrs.tag:
    # that is the stream's `service`.
    - name: nest
      match: docker_logs
      operation: lift
      nested_under: attrs
    - name: modify
      match: docker_logs
      rename: tag service
    # OTLP senders that name no service of their own.
    - name: modify
      match_regex: '.*v1.logs$'
      add: service otlp
    # The machine, as the other stream field. Fluent Bit runs on the host network, so this is the host's name.
    - name: modify
      match_regex: '.*logs$'
      add: host ${HOSTNAME}

  outputs:
    - name: http
      match: '*logs'
      host: 127.0.0.1
      port: 9428
      uri: /insert/jsonline?_stream_fields=service,host&_msg_field=_msg,msg,event,log&_time_field=date
      format: json_lines
      json_date_key: date
      json_date_format: iso8601
      compress: gzip
      retry_limit: false
    - name: prometheus_remote_write
      match_regex: '.*(telemetry|metrics)$'
      host: 127.0.0.1
      port: 8428
      uri: /api/v1/write
