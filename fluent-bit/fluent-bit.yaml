service:
  flush: 1
  log_level: info
  parsers_file: parsers.yaml

pipeline:
  inputs:
    - name: tail
      path: /var/lib/docker/containers/*/*-json.log
      path_key: path
      parser: docker
      tag: docker_logs
      db: /state/docker-logs.db
      mem_buf_limit: 16MB
      skip_long_lines: on
      refresh_interval: 10
    # OTLP/HTTP from anything that speaks it. With no tag set, the URI path becomes the tag
    # (/v1/logs, /v1/metrics), which the outputs below match on.
    - name: opentelemetry
      listen: 127.0.0.1
      port: 4318
    - name: http
      tag: http_logs
      host: 127.0.0.1
      port: 9880
    - name: fluentbit_metrics
      tag: telemetry
      scrape_interval: 30
    # Only the collectors that work in a container on this host: the defaults also include cpufreq
    # (no /sys/.../cpufreq here) and systemd (no D-Bus socket), which log errors on every start.
    - name: node_exporter_metrics
      tag: telemetry
      metrics: cpu,meminfo,loadavg,filesystem,diskstats,netdev,uname,time
      scrape_interval: 30

  filters:
    # Docker's log files only carry the container ID, in the path; lift it into a field.
    - name: lua
      match: docker_logs
      call: add_container_id
      code: |
        function add_container_id(tag, ts, record) local id = string.match(record["path"] or "", "/containers/(%x+)/"); if id then record["container_id"] = string.sub(id, 1, 12) end; record["path"] = nil; return 1, ts, record end
    - name: sysinfo
      match: '*'
      fluentbit_version_key: flb_ver
      os_name_key: os_name
      hostname_key: hostname

  outputs:
    - name: http
      match: '*logs'
      host: 127.0.0.1
      port: 9428
      uri: /insert/jsonline?_stream_fields=container_id&_msg_field=log&_time_field=date
      format: json_lines
      json_date_key: date
      json_date_format: iso8601
      compress: gzip
      retry_limit: false
    - name: prometheus_remote_write
      match_regex: '.*(telemetry|metrics)$'
      host: 127.0.0.1
      port: 8428
      uri: /api/v1/write
