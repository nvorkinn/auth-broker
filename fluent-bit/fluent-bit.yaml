service:
  flush: 1
  log_level: info
  parsers_file: parsers.yaml

pipeline:
  inputs:
    - name: tail
      path: /var/lib/docker/containers/*/*-json.log
      path_key: path
      parser: docker
      tag: docker_logs
      db: /state/docker-logs.db
      mem_buf_limit: 16MB
      skip_long_lines: on
      refresh_interval: 10
    # OTLP/HTTP from anything that speaks it. With no tag set, the URI path becomes the tag
    # (/v1/logs, /v1/metrics), which the outputs below match on.
    - name: opentelemetry
      listen: 127.0.0.1
      port: 4318
    # Accepts a `service` and `host` per record from the sender (defaults: auth-broker, this host).
    - name: http
      tag: http_logs
      host: 127.0.0.1
      port: 9880
    - name: fluentbit_metrics
      tag: telemetry
      scrape_interval: 30
    # Only the collectors that work in a container on this host: the defaults also include cpufreq
    # (no /sys/.../cpufreq here) and systemd (no D-Bus socket), which log errors on every start.
    - name: node_exporter_metrics
      tag: telemetry
      metrics: cpu,meminfo,loadavg,filesystem,diskstats,netdev,uname,time
      scrape_interval: 30

  filters:
    # The host name is picked up here and turned into `host` by normalize.lua, so a sender that
    # already supplies its own `host` (e.g. a device posting to :9880) keeps it.
    - name: sysinfo
      match: '*'
      fluentbit_version_key: flb_ver
      os_name_key: os_name
      hostname_key: _fb_host
    # Docker app logs that are JSON (Caddy, Authentik, ...) get their fields lifted so the level
    # can be read; non-JSON lines pass through untouched.
    - name: parser
      match: docker_logs
      key_name: log
      parser: json_log
      reserve_data: on
      preserve_key: on
    # Standard fields on every log: service, host, level, _msg.
    - name: lua
      match_regex: '.*logs$'
      script: /fluent-bit/etc/normalize.lua
      call: normalize

  outputs:
    - name: http
      match: '*logs'
      host: 127.0.0.1
      port: 9428
      uri: /insert/jsonline?_stream_fields=service,host&_msg_field=_msg&_time_field=date
      format: json_lines
      json_date_key: date
      json_date_format: iso8601
      compress: gzip
      retry_limit: false
    - name: prometheus_remote_write
      match_regex: '.*(telemetry|metrics)$'
      host: 127.0.0.1
      port: 8428
      uri: /api/v1/write
