[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  parsers.conf

# Every container's stdout/stderr, as written by Docker's default json-file driver.
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Path_Key          path
    Parser            docker
    Tag               docker
    DB                /state/docker-logs.db
    Mem_Buf_Limit     16MB
    Skip_Long_Lines   On
    Refresh_Interval  10

# Docker's log files only carry the container ID, in the path; lift it into a field.
[FILTER]
    Name    lua
    Match   docker
    call    add_container_id
    code    function add_container_id(tag, ts, record) local id = string.match(record["path"] or "", "/containers/(%x+)/"); if id then record["container_id"] = string.sub(id, 1, 12) end; record["path"] = nil; return 1, ts, record end

[OUTPUT]
    Name                http
    Match               docker
    Host                127.0.0.1
    Port                9428
    URI                 /insert/jsonline?_stream_fields=container_id&_msg_field=log&_time_field=date
    Format              json_lines
    Json_Date_Key       date
    Json_Date_Format    iso8601
    Compress            gzip
    Retry_Limit         False

# Metrics. VictoriaMetrics doesn't scrape anything itself: Fluent Bit collects
# every metric and forwards it there (host networking, so 127.0.0.1 is the host).
[INPUT]
    Name             fluentbit_metrics
    Tag              metrics.fluent-bit
    Scrape_Interval  60

[INPUT]
    Name             prometheus_scrape
    Tag              metrics.victoria-logs
    Host             127.0.0.1
    Port             9428
    Metrics_Path     /metrics
    Scrape_Interval  60s

[INPUT]
    Name             prometheus_scrape
    Tag              metrics.victoria-metrics
    Host             127.0.0.1
    Port             8428
    Metrics_Path     /metrics
    Scrape_Interval  60s

[OUTPUT]
    Name         prometheus_remote_write
    Match        metrics.*
    Host         127.0.0.1
    Port         8428
    Uri          /api/v1/write
    Retry_Limit  False
